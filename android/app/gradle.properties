# One Gradle at a time per worktree and no daemon left behind: several agents build in parallel on a 24 GB Mac, and idle 3 GB daemons once ran it out of memory
org.gradle.daemon=false
org.gradle.jvmargs=-Xmx2g
android.useAndroidX=false
android.nonTransitiveRClass=true
# The games the APK runs (dm/games/<title ID>), each in a host of its own (libnxhost_<title ID>.so: the host has its profile compiled in, as dm/host/Makefile's GAME).
# The default APK includes Donkey Kong Bananza, Pokémon Pokopia and Mario Kart World (the first is the default).
# ./gradlew -PnxGames=<title ID>,<title ID>,... overrides the list; -PnxGame=<title ID> builds a single-game APK.
nxGame=040074A01BF12000,0400A3A01EE4C000,0400C3F00006E000
